name: CI
on:
  push:
  pull_request:
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # extension/ is committed so a plain GitHub download is installable. The build is reproducible, so a fresh
      # build from this commit's source must match the committed files byte for byte.
      - name: Committed extension/ matches a fresh build
        run: git diff --exit-code --stat -- extension
      # git diff sees tracked files only; a file the build added to extension/ that nobody committed shows up here.
      - name: No stray files in extension/
        run: test -z "$(git status --porcelain -- extension)"
      - run: npm test
      - name: Typecheck
        run: npx tsc --noEmit -p .
      # The offline probes (tools/probe/README.md): headless Chromium through Playwright; youtube.com and soundcloud.com
      # are fixture pages, nothing is fetched. Playwright is not a dependency of the extension, so the harness installs
      # it here the way the README does (tools/probe/package.json is gitignored). record.mjs and record-sc.mjs read
      # the files back with ffprobe and ffmpeg, which the runner image no longer carries; python3 is on it.
      - name: Install ffmpeg for the probes
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg
      - name: Install Playwright Chromium for the probes
        working-directory: tools/probe
        run: |
          npm init -y >/dev/null
          npm i --no-audit --no-fund playwright@1.63.0
          npx playwright install --with-deps chromium
      - name: Probe dock.mjs
        run: node tools/probe/dock.mjs
      - name: Probe record.mjs
        run: node tools/probe/record.mjs
      # From here on the builds rewrite extension/ (the same bytes: the build is reproducible) and add test-build/, so
      # they come after the byte-match and stray-file checks above, and the last step puts the tree back.
      - name: SoundCloud test build (test-build/soundcloud)
        run: KARI_TEST_HOSTS=soundcloud npm run build
      - name: Probe hide.mjs
        run: node tools/probe/hide.mjs
      - name: Probe record-sc.mjs
        run: node tools/probe/record-sc.mjs
      - name: KARI_RECORD=0 build carries no "Record a take" string
        run: |
          KARI_RECORD=0 npm run build
          if grep -rl "Record a take" extension/; then echo "the string is in the KARI_RECORD=0 build"; exit 1; fi
      - name: Restore the committed extension/
        if: always()
        run: git checkout -- extension && test -z "$(git status --porcelain -- extension)"
