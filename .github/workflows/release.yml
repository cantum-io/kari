name: Release
# Publishing a GitHub release attaches kari-extension.zip, built from the release's own tag by CI.
# The stable download link is https://github.com/cantum-io/kari/releases/latest/download/kari-extension.zip
on:
  release:
    types: [published]
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # The zip is built from the tag, so the tag must name the version the package carries.
      - name: Tag is v + package.json version
        run: |
          tag="${{ github.event.release.tag_name }}"
          want="v$(node -p "require('./package.json').version")"
          test "$tag" = "$want" || { echo "release tag $tag, but package.json says $want"; exit 1; }
      - run: npm ci
      - run: npm run build
      - name: Committed extension/ matches a fresh build
        run: git diff --exit-code --stat -- extension
      - run: npm test
      - run: cd extension && zip -qr ../kari-extension.zip . -x '*.DS_Store'
      - name: Attach the zip to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" kari-extension.zip --clobber
